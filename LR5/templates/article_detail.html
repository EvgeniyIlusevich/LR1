{% extends 'base.html' %}
{% load static %}

{% block title %}{{ article.title }}{% endblock %}

{% block extra_css %}
<style>
    .container {
        max-width: 800px;
    }
    h1 {
        font-size: 2.5rem;
        font-weight: 800;
        line-height: 1.2;
        margin-bottom: 1.5rem;
        letter-spacing: -0.03em;
        color: #fff;
    }
    .article-card {
        background-color: var(--bg-card);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 2rem;
        box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.2);
    }
    .article-image-wrapper {
        width: 100%;
        max-height: 450px;
        overflow: hidden;
        border-radius: 12px;
        margin-bottom: 2rem;
        border: 1px solid rgba(255, 255, 255, 0.05);
    }
    .article-image-wrapper img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
    }
    .article-content {
        color: #e2e8f0;
        font-size: 1.1rem;
        font-weight: 400;
        white-space: pre-line;
        margin-bottom: 2.5rem;
    }
    .btn-back {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        color: var(--text-muted);
        text-decoration: none;
        font-size: 0.95rem;
        font-weight: 500;
        transition: var(--transition);
        padding: 0.5rem 0;
    }
    .btn-back:hover {
        color: var(--accent);
        transform: translateX(-4px);
    }
    @media (max-width: 768px) {
        h1 {
            font-size: 1.85rem;
        }
        .article-card {
            padding: 1.25rem;
        }
        .article-image-wrapper {
            max-height: 280px;
            margin-bottom: 1.25rem;
        }
        .article-content {
            font-size: 1rem;
        }
    }
</style>
{% endblock %}

{% block content %}
<h1>{{ article.title }}</h1>
<article class="article-card">
    {% if article.image %}
        <div class="article-image-wrapper">
            <img src="{{ article.image.url }}" alt="{{ article.title }}">
        </div>
    {% endif %}
    <div class="article-content">
        {{ article.content }}
    </div>
    <a href="{% url 'article_list' %}" class="btn-back">
        ← Вернуться к списку статей
    </a>
</article>
{% endblock %}
